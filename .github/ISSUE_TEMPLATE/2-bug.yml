name: 버그 신고
description: 실행이 안 되거나 이상하게 동작할 때
title: "[버그] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 내용
      description: 무슨 일이 일어났고, 어떻게 하면 다시 일어나는지
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 쓴 방법
      options: [웹, hdTransGUI, CLI, J2KEngine.dll + 번역 도구, C API, 빌드]
  - type: input
    id: env
    attributes:
      label: 버전, OS, 함께 쓴 도구
