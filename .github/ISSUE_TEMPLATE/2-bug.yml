name: 버그 신고
description: 실행이 안 되거나 이상하게 동작할 때
title: "[버그] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 버전
      placeholder: hdtrans -version 결과, 또는 웹 화면 아래의 버전
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS와 함께 쓴 도구
      placeholder: Windows 11 64비트, LunaTranslator 10.6
  - type: dropdown
    id: where
    attributes:
      label: 쓴 방법
      options: [웹, 번역 창(hdTransGUI), 명령줄(hdtrans), 이지트랜스 도구에 끼워서, 직접 만든 프로그램에서, 직접 빌드]
  - type: textarea
    id: steps
    attributes:
      label: 내용과 다시 일으키는 방법
      description: 오류 메시지나 스크린샷이 있으면 붙여 주세요.
    validations:
      required: true
