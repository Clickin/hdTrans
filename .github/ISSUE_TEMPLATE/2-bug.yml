name: 버그 신고
description: 실행이 안 되거나 이상하게 동작할 때
title: "[버그] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 버전
      placeholder: hdtrans -version 결과, 또는 웹 화면 아래의 버전
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS와 함께 쓴 도구
      placeholder: Windows 11 64비트, LunaTranslator 10.6
  - type: dropdown
    id: where
    attributes:
      label: 어디서 썼나요
      options: [LunaTranslator, XUnity.AutoTranslator, 아랄트랜스, Textractor나 ITH + 아네모네, VNR, hdTransGUI 직접 실행, 웹 (trans.kuri.kr), 명령줄 (hdtrans), 기타, 직접 빌드]
  - type: textarea
    id: steps
    attributes:
      label: 내용과 다시 일으키는 방법
      description: 오류 메시지나 스크린샷이 있으면 붙여 주세요.
    validations:
      required: true
