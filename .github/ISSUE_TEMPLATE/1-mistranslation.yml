name: 오역 신고
description: 번역 결과가 틀렸거나 어색할 때
title: "[오역] "
labels: [mistranslation]
body:
  - type: textarea
    id: source
    attributes:
      label: 원문
      description: 틀린 부분이 들어 있는 일본어 한 줄이나 짧은 문장. 긴 글은 붙이지 마세요.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 지금 번역
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대하는 번역
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 쓴 방법
      options:
        - 웹 (trans.kuri.kr)
        - hdTransGUI
        - hdtrans CLI
        - J2KEngine.dll + 번역 도구
        - C API
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: "`hdtrans -version` 결과나 웹 화면 아래의 버전"
  - type: checkboxes
    id: extras
    attributes:
      label: 켜 둔 것
      options:
        - label: 사용자 사전
        - label: Ehnd(꿀도르)
  - type: textarea
    id: why
    attributes:
      label: -why 출력 (선택)
      description: "`hdtrans -why`로 그 줄을 번역한 결과"
      render: text
