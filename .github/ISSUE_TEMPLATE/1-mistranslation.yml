name: 오역 신고
description: 번역이 틀렸거나 어색할 때
title: "[오역] "
labels: [mistranslation]
body:
  - type: textarea
    id: source
    attributes:
      label: 원문
      description: 틀린 부분이 있는 일본어 한두 줄
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: 지금 번역
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: 기대하는 번역
  - type: dropdown
    id: where
    attributes:
      label: 쓴 방법
      options: [웹, hdTransGUI, CLI, J2KEngine.dll + 번역 도구, C API]
  - type: input
    id: version
    attributes:
      label: 버전
