name: Build

on:
  push:
    branches: [main, 'ci/**', platforms]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 1G
  CCACHE_DIR: ${{ github.workspace }}/build/ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [linux, windows-x64, windows-x86, mac, wasm]
    runs-on: ${{ startsWith(matrix.preset, 'windows-') && 'windows-latest' || matrix.preset == 'mac' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC for Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSVC_ARCH: ${{ matrix.preset == 'windows-x86' && 'amd64_x86' || 'x64' }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio installation not found' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $command = "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $env:MSVC_ARCH >nul && set"
          $environment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'vcvarsall failed' }
          foreach ($line in $environment) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)
            if (!$before.ContainsKey($name) -or $before[$name] -cne $value) {
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
      - name: Set up Emscripten
        if: matrix.preset == 'wasm'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.22
          actions-cache-folder: build/emsdk
      - name: Set up ccache for Emscripten
        if: matrix.preset == 'wasm'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          # Keep sysroot paths stable in both cold and restored compiler caches.
          sdk="$GITHUB_WORKSPACE/build/emsdk/emsdk-main"
          "$sdk/emsdk" activate 4.0.22
          source "$sdk/emsdk_env.sh"
          env | grep '^EMSDK' >> "$GITHUB_ENV"
          echo "EM_CONFIG=$sdk/.emscripten" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk" "$sdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Set up Node for the WASM smoke test
        if: matrix.preset == 'wasm'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Set up sccache
        if: matrix.preset != 'wasm'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Restore native compiler cache
        if: matrix.preset != 'wasm'
        uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-
      - name: Restore WASM compiler cache
        if: matrix.preset == 'wasm'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-wasm-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-wasm-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-wasm-
      - name: Select parallelism
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            jobs="$NUMBER_OF_PROCESSORS"
          else
            jobs="$(getconf _NPROCESSORS_ONLN)"
          fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          if [[ "${{ matrix.preset }}" == wasm ]]; then
            # ccache accepts the -Xclang arguments in Emscripten's Clang calls.
            EM_COMPILER_WRAPPER=ccache emcmake cmake --preset wasm -G Ninja
            ccache --zero-stats
          elif [[ "$RUNNER_OS" == Windows ]]; then
            cmake --preset "${{ matrix.preset }}" -G Ninja -A "" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache
          else
            cmake --preset "${{ matrix.preset }}" -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          fi
      - name: Build CLI, libraries and tests
        env:
          EM_COMPILER_WRAPPER: ${{ matrix.preset == 'wasm' && 'ccache' || '' }}
        run: cmake --build --preset "${{ matrix.preset }}" --parallel "$BUILD_JOBS"
      - name: Stage dictionaries for the Windows host probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dicts = "build/${{ matrix.preset }}/dicts"
          New-Item -ItemType Directory -Force $dicts | Out-Null
          Copy-Item 'dicts/*' $dicts -Recurse -Force
      - name: Test without external fixtures
        run: |
          unset HDTRANS_REQUIRE_ALL HDTRANS_GOLDEN HDTRANS_DICTS HDTRANS_TEST_EXCLUDE
          if [[ "${{ matrix.preset }}" == wasm ]]; then
            node --experimental-default-type=module tools/wasm_smoke.mjs \
              build/wasm/hdTransEngine.js tests/unit/dict/testdata/folder/base.tsv \
              2>&1 | tee build/wasm/ctest.log
          else
            export HDTRANS_DICTS="$GITHUB_WORKSPACE/dicts"
            ctest --preset "${{ matrix.preset }}" --parallel "$BUILD_JOBS" --verbose \
              2>&1 | tee "build/${{ matrix.preset }}/ctest.log"
          fi
      - name: Report fixture skips and test results
        if: always()
        run: |
          log="build/${{ matrix.preset }}/ctest.log"
          if [[ -f "$log" ]]; then
            {
              echo '### ${{ matrix.preset }} tests'
              echo '```text'
              grep -E 'SKIP |Skipped|PASS wasm smoke|[0-9]+ run, [0-9]+ failed, [0-9]+ skipped|tests passed' "$log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report compiler cache
        if: always()
        run: |
          mkdir -p "build/${{ matrix.preset }}"
          if [[ "${{ matrix.preset }}" == wasm ]]; then
            ccache --show-stats --verbose 2>&1 | tee "build/wasm/ccache.log"
          else
            sccache --show-stats 2>&1 | tee "build/${{ matrix.preset }}/sccache.log"
            sccache --stop-server
          fi
      - name: Upload CLI and libraries
        uses: actions/upload-artifact@v7
        with:
          name: hdtrans-${{ matrix.preset }}
          overwrite: true
          if-no-files-found: error
          path: |
            build/${{ matrix.preset }}/hdtrans
            build/${{ matrix.preset }}/libhdTransCore.a
            build/${{ matrix.preset }}/libhdTransEngine.so
            build/${{ matrix.preset }}/libhdTransEngine.dylib
            build/${{ matrix.preset }}/hdtrans.exe
            build/${{ matrix.preset }}/hdTransCore.lib
            build/${{ matrix.preset }}/hdTransEngine.dll
            build/${{ matrix.preset }}/hdTransEngine.lib
            build/${{ matrix.preset }}/J2KEngine.dll
            build/${{ matrix.preset }}/J2KEngine.lib
            build/${{ matrix.preset }}/hdTransEngine.js
            build/${{ matrix.preset }}/hdTransEngine.wasm
      - name: Upload test and compiler-cache logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.preset }}
          overwrite: true
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/ctest.log
            build/${{ matrix.preset }}/sccache.log
            build/${{ matrix.preset }}/ccache.log
