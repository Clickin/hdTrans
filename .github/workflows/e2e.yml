name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syosetu:
    name: syosetu chapters, base vs head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then base=$PR_BASE; else base=$(git rev-parse HEAD^); fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$base:dicts" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Base commit $base has no dicts/; the end-to-end comparison is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the base CLI
        if: steps.base.outputs.run == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          cmake --preset linux
          cmake --build --preset linux --target hdtrans_cli
      - name: Build the head CLI
        if: steps.base.outputs.run == 'true'
        run: |
          cmake --preset linux
          cmake --build --preset linux --target hdtrans_cli
      - name: Restore the chapter cache
        if: steps.base.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/e2e/*.ja.txt
          key: syosetu-${{ hashFiles('tests/e2e/*.ja.txt') }}-${{ github.run_id }}
          restore-keys: |
            syosetu-${{ hashFiles('tests/e2e/*.ja.txt') }}-
            syosetu-
      - name: Fetch missing chapters
        id: fetch
        if: steps.base.outputs.run == 'true'
        run: |
          tools/fetch-syosetu.sh tests/e2e build/e2e | tee "$RUNNER_TEMP/fetch.log"
          grep -q '^fetch: 0 downloaded' "$RUNNER_TEMP/fetch.log" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Save the chapter cache
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/e2e/*.ja.txt
          key: syosetu-${{ hashFiles('tests/e2e/*.ja.txt') }}-${{ github.run_id }}
      - name: Compare base and head translations
        if: steps.base.outputs.run == 'true'
        env:
          HDTRANS_DICTS_A: ${{ runner.temp }}/base/dicts
        run: tools/e2e.sh "$RUNNER_TEMP/base/build/linux/hdtrans" build/linux/hdtrans "$GITHUB_WORKSPACE/dicts" build/e2e
