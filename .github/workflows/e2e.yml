name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testdata:
    name: test data, expected vs head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Secrets are not given to pull requests from forks; the comparison is then skipped.
      HAS_KEY: ${{ secrets.HDTRANS_TESTDATA_KEY != '' }}
    steps:
      - name: Skip without the test-data key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::HDTRANS_TESTDATA_KEY is not available; the test-data comparison is skipped."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
      - name: Check out the test data
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: sokcuri/hdTrans-data
          ssh-key: ${{ secrets.HDTRANS_TESTDATA_KEY }}
          persist-credentials: false
          path: testdata
      - name: Build the CLI
        if: env.HAS_KEY == 'true'
        run: |
          cmake --preset linux -DHDTRANS_WERROR=OFF
          cmake --build --preset linux --target hdtrans_cli --parallel
      - name: Compare with the expected outputs
        if: env.HAS_KEY == 'true'
        # Exit 1 means translations changed, which is reported, not a failure; 2 is an error.
        # The texts are private: summary and log carry counts only.
        run: |
          set +e
          tools/e2e.sh --expected testdata build/linux/hdtrans "$GITHUB_WORKSPACE/dicts" > "$RUNNER_TEMP/e2e.log"
          status=$?
          # The log is public: print per-chapter counts only, never translated lines.
          grep -E '^[^ ]+: [0-9]+ changed lines?$|^e2e: ' "$RUNNER_TEMP/e2e.log"
          tail -n 1 "$RUNNER_TEMP/e2e.log" | grep '^e2e: ' >> "$GITHUB_STEP_SUMMARY"
          case $status in
            0) echo 'No translation changed.' >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo 'Translations changed; accept them in the test data once this is on main.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          [ "$status" -le 1 ]
