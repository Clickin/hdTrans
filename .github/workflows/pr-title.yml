name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: [^\s].*$/u;
            if (!pattern.test(title)) {
              core.setFailed('Use <type>(optional scope): <summary>, for example fix(rules): 조건 뒤 인용 수정. See docs/contributing.md.');
            }
